[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-sdk-py"
version = "0.1.0"
description = "Python SDK for Grid — Tron-style autonomous bot battles"
requires-python = ">=3.10"
dependencies = [
    "websocket-client>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gridbot*"]
