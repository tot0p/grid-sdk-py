[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-sdk-py"
version = "0.1.0"
description = "Python SDK for Grid — Tron-style autonomous bot battles"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["tron", "bot", "game", "websocket", "grid"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "websocket-client>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/tot0p/grid-sdk-py"
Repository = "https://github.com/tot0p/grid-sdk-py"
Issues = "https://github.com/tot0p/grid-sdk-py/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["gridbot*"]
